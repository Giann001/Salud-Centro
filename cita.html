<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solicitud de Cita</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 class="text-center">Salud Centro</h1>
    <p class="text-center">Solicitud de cita</p>
    <form id="formCita">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" id="nombre" name="nombre" class="form-control">
            <div id="errorNombre" class="text-danger"></div>
        </div>
        <div class="mb-3">
            <label for="correo" class="form-label">Correo</label>
            <input type="email" id="correo" name="correo" class="form-control">
            <div id="errorCorreo" class="text-danger"></div>
        </div>
        <div class="mb-3">
            <label for="especialidad" class="form-label">Especialidad</label>

            <select id="especialidad" name="especialidad" class="form-select">
                <option value="">Seleccione una especialidad</option>
                <option value="Consulta general">Consulta general</option>
                <option value="Odontología">Odontología</option>
                <option value="Nutrición">Nutrición</option>
            </select>

            <div id="errorEspecialidad" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label for="fecha" class="form-label">Fecha</label>
            <input type="date" id="fecha" name="fecha" class="form-control">
            <div id="errorFecha" class="text-danger"></div>
        </div>
        <div class="mb-3">
            <label for="horario" class="form-label">Horario</label>

            <select id="horario" name="horario" class="form-select">
                <option value="">Seleccione un horario</option>
            </select>

            <div id="errorHorario" class="text-danger"></div>
        </div>

        <button type="submit" class="btn btn-primary">
            Enviar solicitud
        </button>
    </form>
</div>
<script src="js/citas.js"></script>
</body>
</html>
