<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmación de Cita</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 class="text-center">Confirmación de solicitud</h1>
    <div id="mensaje"></div>
    <div id="datosCita" class="card p-4 mt-4">
        <h3>Datos de la solicitud</h3>
        <p><strong>Nombre:</strong> <span id="mostrarNombre"></span></p>
        <p><strong>Especialidad:</strong> <span id="mostrarEspecialidad"></span></p>
        <p><strong>Fecha:</strong> <span id="mostrarFecha"></span></p>
        <p><strong>Horario:</strong> <span id="mostrarHorario"></span></p>
        <a href="cita.html" class="btn btn-secondary">
            Corregir solicitud
        </a>

    </div>

</div>

<script src="js/confirmacion-cita.js"></script>

</body>
</html>
